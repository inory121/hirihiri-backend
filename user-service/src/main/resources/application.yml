server:
  port: 11452
spring:
  application:
    name: user-service
  config:
    import: "nacos:global-config.yml"
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'user-service'
      paths-to-match: '/**'
      packages-to-scan: com.hiiro.controller

# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn