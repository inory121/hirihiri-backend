server:
  port: 8080
spring:
  application:
    name: gateway
  config:
    import: "nacos:global-config.yml"
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: '*'
            allowed-methods: '*'
            allowed-headers: '*'
      routes:
        - id: user-route
          uri: lb://user-service
          predicates:
            - Path=/api/user/**
        - id: video-route
          uri: lb://video-service
          predicates:
            - Path=/api/video/**,/api/category/**,/api/upload/**,/api/danmaku/**,/api/comment/**