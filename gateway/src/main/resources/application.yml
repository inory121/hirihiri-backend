server:
  port: 11451
spring:
  application:
    name: gateway
  config:
    import: "nacos:global-config.yml"
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    gateway:
      routes:
        - id: user-route
          uri: lb://user-service
          predicates:
            - Path=/api/user/**,/api/follow/**,/api/message/**
        - id: message-ws-route
          uri: lb:ws://user-service
          predicates:
            - Path=/ws/message
        - id: video-route
          uri: lb://video-service
          predicates:
            - Path=/api/video/**,/api/category/**,/api/danmaku/**,/api/comment/**,/api/history/**,/api/favorite/**,/api/recommend/**,/api/dynamic/**
# 网关鉴权公开路径配置（无需登录即可访问）
# 使用 Spring PathPattern 语法，支持通配符和正则变量：
#   /api/xxx              精确匹配
#   /api/xxx/**           匹配任意子路径
#   /api/xxx/{id:[0-9]+}  仅匹配数字变量，避免误匹配敏感子路径（如 upload）
# 新增公开接口只需在此列表追加一行，无需修改 AuthFilter 代码
security:
  public-paths:
    - /api/user/register
    - /api/user/login
    - /api/user/admin/login
    - /api/user/search
    - /api/user/info/{uid:[0-9]+}
    - /api/video/recommend
    - /api/video/all
    - /api/video/search
    - /api/video/search/hot
    - /api/video/search/suggest
    - /api/video/user/{uid:[0-9]+}
    - /api/video/play
    - /api/video/heartbeat
    - /api/video/{vid:[0-9]+}
    - /api/comment/video/{vid:[0-9]+}
    - /api/danmaku/video/{vid:[0-9]+}
    - /api/category/get/all
    - /api/follow/count/{uid:[0-9]+}
    - /api/follow/followers/{uid:[0-9]+}
    - /api/follow/followings/{uid:[0-9]+}
    - /api/video/interaction/status/{vid:[0-9]+}
    - /api/video/interaction/recent/coins
    - /api/video/interaction/recent/likes
    - /api/favorite/folders
    - /api/favorite/recent
    - /api/favorite/folder/{folderId:[0-9]+}/videos
    - /api/recommend/feed
    - /api/recommend/events
    - /api/recommend/events/**
    - /api/recommend/related/**
    - /api/dynamic/list
    - /api/dynamic/up-list
    - /ws/message
