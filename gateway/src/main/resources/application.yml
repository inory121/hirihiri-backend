server:
  port: 11451
spring:
  application:
    name: gateway
  config:
    import: "nacos:global-config.yml"
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: '*'
            allowed-methods: 'GET,POST,PUT,DELETE,OPTIONS'
            allowed-headers: 'Authorization,Content-Type,X-Requested-With,uid,token'
            allow-credentials: true
      routes:
        - id: user-route
          uri: lb://user-service
          predicates:
            - Path=/api/user/**,/api/follow/**
        - id: video-route
          uri: lb://video-service
          predicates:
            - Path=/api/video/**,/api/category/**,/api/upload/**,/api/danmaku/**,/api/comment/**,/api/history/**