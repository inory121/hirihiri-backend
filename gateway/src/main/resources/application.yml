server:
  port: 520

spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: '*'
            allowed-methods: '*'
            allowed-headers: '*'
      routes:
        - id: user-route
          uri: lb://user-service
          predicates:
            - Path=/api/user/**
        - id: video-route
          uri: lb://video-service
          predicates:
            - Path=/api/video/**,/api/category/**