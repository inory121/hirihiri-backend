server:
  port: 8082
management:
  endpoints:
    web:
      exposure:
        include: health # 暴露健康检查端点
spring:
  application:
    name: video-service
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  config:
    import: "nacos:video-service.yml"
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
  #    consul:
  #      host: localhost
  #      port: 8500
  #      discovery:
  #        seervice-name: ${spring.application.name}
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hirihiri?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowMultiQueries=true&allowPublicKeyRetrieval=true
    username: root
    password: 12345
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
  data:
    redis:
      database: 1
      host: "localhost"
      port: 6379
      # 连接超时
      connect-timeout: 5s
      # 读超时
      timeout: 5s
      # Lettuce 客户端的配置
      lettuce:
        # 连接池配置
        pool:
          # 最小空闲连接
          min-idle: 0
          # 最大空闲连接
          max-idle: 8
          # 最大活跃连接
          max-active: 8
          # 从连接池获取连接 最大超时时间，小于等于0则表示不会超时
          max-wait: -1ms
# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'video-service'
      paths-to-match: '/**'
      packages-to-scan: com.hiiro.controller

# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn
#mybatisplus打印sql日志
